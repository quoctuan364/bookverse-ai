name: bookverse-test

services:
  db:
    restart: "no"
    environment:
      POSTGRES_USER: ${BOOKVERSE_TEST_POSTGRES_USER:?BOOKVERSE_TEST_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${BOOKVERSE_TEST_POSTGRES_PASSWORD:?BOOKVERSE_TEST_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${BOOKVERSE_TEST_POSTGRES_DB:?BOOKVERSE_TEST_POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${BOOKVERSE_TEST_POSTGRES_PORT:-5433}:5432"

  web:
    restart: "no"
    environment:
      DATABASE_URL: ${BOOKVERSE_TEST_DOCKER_DATABASE_URL:?BOOKVERSE_TEST_DOCKER_DATABASE_URL is required}
      AUTH_SECRET: ${BOOKVERSE_TEST_AUTH_SECRET:?BOOKVERSE_TEST_AUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      AI_SERVICE_URL: http://ai_service:8000
      BOOKVERSE_CHAT_MOCK_ENABLED: "false"
    ports:
      - "127.0.0.1:${BOOKVERSE_TEST_WEB_PORT:-3100}:3000"

  ai_service:
    restart: "no"
    environment:
      DATABASE_URL: ${BOOKVERSE_TEST_AI_DATABASE_URL:?BOOKVERSE_TEST_AI_DATABASE_URL is required}
    ports:
      - "127.0.0.1:${BOOKVERSE_TEST_AI_PORT:-8100}:8000"
