name: bookverse-production

services:
  db:
    restart: always
    ports:
      - "${BOOKVERSE_PRODUCTION_BIND_ADDRESS:?BOOKVERSE_PRODUCTION_BIND_ADDRESS is required}:${BOOKVERSE_PRODUCTION_POSTGRES_PORT:?BOOKVERSE_PRODUCTION_POSTGRES_PORT is required}:5432"

  web:
    command: npm run start:production
    restart: always
    environment:
      NODE_ENV: production
      BOOKVERSE_CHAT_MOCK_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      BOOKVERSE_PASSWORD_RESET_WEBHOOK_URL: ${BOOKVERSE_PASSWORD_RESET_WEBHOOK_URL:?BOOKVERSE_PASSWORD_RESET_WEBHOOK_URL is required}
      BOOKVERSE_PASSWORD_RESET_WEBHOOK_TOKEN: ${BOOKVERSE_PASSWORD_RESET_WEBHOOK_TOKEN:?BOOKVERSE_PASSWORD_RESET_WEBHOOK_TOKEN is required}
      BOOKVERSE_AI_SERVICE_TOKEN: ${BOOKVERSE_AI_SERVICE_TOKEN:?BOOKVERSE_AI_SERVICE_TOKEN is required}
    ports:
      - "${BOOKVERSE_PRODUCTION_BIND_ADDRESS:?BOOKVERSE_PRODUCTION_BIND_ADDRESS is required}:${BOOKVERSE_PRODUCTION_WEB_PORT:?BOOKVERSE_PRODUCTION_WEB_PORT is required}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ai_service:
    restart: always
    environment:
      NODE_ENV: production
      BOOKVERSE_AI_SERVICE_TOKEN: ${BOOKVERSE_AI_SERVICE_TOKEN:?BOOKVERSE_AI_SERVICE_TOKEN is required}
      BOOKVERSE_AI_ALLOWED_ORIGINS: ${BOOKVERSE_AI_ALLOWED_ORIGINS:?BOOKVERSE_AI_ALLOWED_ORIGINS is required}
    ports:
      - "${BOOKVERSE_PRODUCTION_BIND_ADDRESS:?BOOKVERSE_PRODUCTION_BIND_ADDRESS is required}:${BOOKVERSE_PRODUCTION_AI_PORT:?BOOKVERSE_PRODUCTION_AI_PORT is required}:8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
