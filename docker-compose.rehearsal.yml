services:
  db:
    image: pgvector/pgvector:0.8.5-pg16
    restart: "no"
    environment:
      POSTGRES_USER: ${REHEARSAL_POSTGRES_USER:?REHEARSAL_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${REHEARSAL_POSTGRES_PASSWORD:?REHEARSAL_POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${REHEARSAL_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - rehearsal_pgdata:/var/lib/postgresql/data

volumes:
  rehearsal_pgdata:
